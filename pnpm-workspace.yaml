# @format

packages:
    - apps/*
    - packages/*
    - services/*
    - clients/*
    - .xernerx/*

allowBuilds:
    bcrypt: true
    cpu-features: false
    electron: true
    electron-winstaller: true
    esbuild: true
    mongodb-memory-server: true
    sharp: true
    ssh2: false
    unrs-resolver: true

minimumReleaseAgeExclude:
    - framer-motion@13.0.0
    - motion-dom@13.0.0
    - motion-utils@13.0.0
    - lucide-react@1.30.0
    - '@next/env@16.3.1'
    - '@next/swc-darwin-arm64@16.3.1'
    - '@next/swc-darwin-x64@16.3.1'
    - '@next/swc-linux-arm64-gnu@16.3.1'
    - '@next/swc-linux-arm64-musl@16.3.1'
    - '@next/swc-linux-x64-gnu@16.3.1'
    - '@next/swc-linux-x64-musl@16.3.1'
    - '@next/swc-win32-arm64-msvc@16.3.1'
    - '@next/swc-win32-x64-msvc@16.3.1'
    - next@16.3.1
    - '@xernerx/commands@0.2.2 || 0.2.3 || 0.2.4 || 0.2.6 || 0.2.11'
    - '@xernerx/framework@1.0.3 || 1.1.1 || 1.3.1'
    - '@xernerx/stats@1.0.12 || 1.0.14 || 1.0.17'
    - '@xernerx/terminal@1.1.14 || 1.1.15 || 1.2.4'
    - 'xernerx@5.0.1'
    - '@xernerx/extension-builder@0.1.0 || 0.1.3'
    - lucide-react-native@1.77.0
    - react-native-reanimated@4.8.0
    - react-native-worklets@0.14.0

overrides:
    suite: 'link:'
