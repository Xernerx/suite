name: Release

on:
    push:
        tags:
            - 'desktop@*'
            - 'mobile@*'

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release-desktop:
        name: Release Desktop
        if: startsWith(github.ref, 'refs/tags/desktop@')
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install deps
              run: pnpm install

            - name: Build desktop
              run: pnpm --filter ./apps/desktop build

            - name: Package desktop
              run: pnpm --filter ./apps/desktop dist -- --publish=never

            - name: Publish Desktop Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      apps/desktop/release/**/*.exe
                      apps/desktop/release/**/*.dmg
                      apps/desktop/release/**/*.AppImage
                      apps/desktop/release/**/*.yml
                      apps/desktop/release/**/*.blockmap
                  tag_name: ${{ github.ref_name }}
                  name: Desktop ${{ github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release-mobile:
        name: Release Mobile
        if: startsWith(github.ref, 'refs/tags/mobile@')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install deps
              run: pnpm install --frozen-lockfile

            # Add your Expo / Mobile build steps here
            # - name: Build and publish mobile
            #   run: ...

            - name: Publish Mobile Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      # apps/mobile/release/**/*.apk
                  tag_name: ${{ github.ref_name }}
                  name: Mobile ${{ github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
