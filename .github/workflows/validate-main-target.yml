name: Validate PR Source

on:
    pull_request:
        branches:
            - main

jobs:
    check-source:
        name: Check Source Branch
        runs-on: ubuntu-latest
        steps:
            - name: Verify source is canary
              run: |
                  echo "Source branch: ${{ github.head_ref }}"
                  if [ "${{ github.head_ref }}" != "canary" ]; then
                    echo "❌ Error: Direct pull requests to main are only permitted from the 'canary' branch."
                    exit 1
                  fi
                  echo "✅ Source branch is valid."
