name: Canary

on:
    push:
        branches:
            - canary

jobs:
    # 1. Call the shared build workflow
    build:
        uses: ./.github/workflows/build.yml

    # 2. Wait for it to pass before packaging desktop apps
    canary-desktop:
        name: Canary Desktop
        needs: [build]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install deps
              run: pnpm install

            - name: Build and Package Canary Desktop
              run: |
                  cd apps/desktop
                  npm pkg set version="$(node -p "require('./package.json').version")-canary.$(git rev-parse --short HEAD)"
                  cd ../..

                  pnpm --filter ./apps/desktop build
                  pnpm --filter ./apps/desktop dist --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to Rolling Canary Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      apps/desktop/release/**/*.exe
                      apps/desktop/release/**/*.dmg
                      apps/desktop/release/**/*.AppImage
                      apps/desktop/release/**/*.yml
                      apps/desktop/release/**/*.blockmap
                  tag_name: canary
                  name: 'Xernerx Canary (Rolling)'
                  body: 'Automated bleeding-edge build from the canary branch.'
                  prerelease: true
                  make_latest: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
