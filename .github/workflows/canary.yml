name: Canary

on:
    push:
        branches:
            - canary

jobs:
    # 1. Call the shared build workflow
    build:
        uses: ./.github/workflows/build.yml

    # 2. Build and package on each OS independently, then upload only installers
    canary-desktop:
        name: Canary Desktop (${{ matrix.os }})
        needs: [build]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install deps
              run: pnpm install

            - name: Build and Package Desktop
              run: |
                  cd apps/desktop
                  npm pkg set version="$(node -p "require('./package.json').version")-canary.$(git rev-parse --short HEAD)"
                  cd ../..

                  pnpm --filter ./apps/desktop build
                  pnpm --filter ./apps/desktop dist --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Desktop Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-release-${{ matrix.os }}
                  path: |
                      apps/desktop/release/*.exe
                      apps/desktop/release/*.dmg
                      apps/desktop/release/*.AppImage
                      apps/desktop/release/*.yml
                      apps/desktop/release/*.blockmap
                  if-no-files-found: error

    # 3. Collect all installers and publish them as a unique versioned pre-release
    publish-canary:
        name: Publish Canary Release
        needs: [canary-desktop]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download All Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-artifacts

            - name: Create Unique Version Tag
              id: tag
              run: |
                  cd apps/desktop
                  VERSION=$(node -p "require('./package.json').version")
                  COMMIT=$(git rev-parse --short HEAD)
                  TAG="v${VERSION}-canary.${COMMIT}"

                  echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
                  echo "release_name=Xernerx App ${TAG}" >> $GITHUB_OUTPUT

                  # Create and push the unique tag to the repo
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${TAG}"
                  git push origin "${TAG}"

            - name: Publish to GitHub Releases
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      all-artifacts/desktop-release-ubuntu-latest/*
                      all-artifacts/desktop-release-windows-latest/*
                      all-artifacts/desktop-release-macos-latest/*
                  tag_name: ${{ steps.tag.outputs.tag_name }}
                  name: ${{ steps.tag.outputs.release_name }}
                  body: 'Automated bleeding-edge pre-release build from the canary branch.'
                  prerelease: true
                  make_latest: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
