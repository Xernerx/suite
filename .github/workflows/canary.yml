name: Canary

on:
    push:
        branches:
            - canary

jobs:
    # 1. Call the shared build workflow
    build:
        uses: ./.github/workflows/build.yml

    # 2. Build and package on each OS independently
    canary-desktop:
        name: Canary Desktop (${{ matrix.os }})
        needs: [build]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install deps
              run: pnpm install

            - name: Build and Package Desktop
              run: |
                  cd apps/desktop
                  npm pkg set version="$(node -p "require('./package.json').version")-canary.$(git rev-parse --short HEAD)"
                  cd ../..

                  pnpm --filter ./apps/desktop build
                  pnpm --filter ./apps/desktop dist --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Desktop Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-release-${{ matrix.os }}
                  path: |
                      apps/desktop/release/*.exe
                      apps/desktop/release/*.dmg
                      apps/desktop/release/*.AppImage
                      apps/desktop/release/*.yml
                      apps/desktop/release/*.blockmap
                  if-no-files-found: error

    # 3. Force-update the rolling canary tag and publish/overwrite the release
    publish-canary:
        name: Publish Rolling Canary Preview
        needs: [canary-desktop]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download All Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: all-artifacts

            - name: Force Update Rolling Canary Tag
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  # Delete local and remote canary tags cleanly without branch conflicts
                  git tag -d canary || true
                  git push origin --delete tag canary || true

                  # Re-create tag at current HEAD and push
                  git tag canary
                  git push origin canary --force

            - name: Publish Rolling Canary Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      all-artifacts/desktop-release-ubuntu-latest/*
                      all-artifacts/desktop-release-windows-latest/*
                      all-artifacts/desktop-release-macos-latest/*
                  tag_name: canary
                  name: 'Xernerx Canary (Latest Preview)'
                  body: 'Automated rolling bleeding-edge preview build from the canary branch. Always points to the most recent commit.'
                  prerelease: true
                  draft: false
                  make_latest: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
