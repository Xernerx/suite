name: Sync Dictionary Branch

on:
    push:
        branches:
            - canary

jobs:
    sync-branch:
        name: Merge Canary to Dictionary
        # Prevent infinite loops by skipping if the commit was made by the auto-sync bot
        if: "!contains(github.event.head_commit.message, 'auto-sync dictionary into canary')"
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Dictionary Branch
              uses: actions/checkout@v4
              with:
                  ref: dictionary
                  fetch-depth: 0 # Needed to fetch all history for merging

            - name: Setup Git Identity
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Merge Canary into Dictionary
              run: |
                  # Fetch the latest canary branch from origin
                  git fetch origin canary

                  # Merge canary into dictionary. 
                  # -X theirs ensures that if there are any merge conflicts, canary's changes will automatically win.
                  git merge origin/canary -X theirs --allow-unrelated-histories -m "chore: auto-sync canary into dictionary"

                  # Push the result back to origin
                  git push origin HEAD:refs/heads/dictionary
